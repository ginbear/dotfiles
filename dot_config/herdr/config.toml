onboarding = false
[keys]
prefix = "ctrl+t"

[theme]
name = "terminal"
auto_switch = true

[ui.toast]
delivery = "system"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sound]
enabled = true

[experimental]
pane_history = true

[[keys.command]]
key = "cmd+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
